
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: beispiel-app



jobs:
  lint:
    runs-on: ubuntu:latest
    steps:
      - uses: actions/checkout@v4
      - name: lint
        run: make lint


  test:
    runs-on: ubuntu:latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4:
    - uses: actions/setup-python@v5
      with: 
        python-version: matrix.python-version
        cache: pip
        cache-dependency-path: beispiel-app/requirements-dev.txt
    - name: Coverage Report
      run: make cov
    - name: Upload Coverage Report
      if: matrix.python-version == "3.12"
      uses: actions/upload-artifact@v4
      with:
        name: coverage-report
        path: beispiel-app/coverage.xml
        if-no-files-found: error

  build:
    runs-on: ubuntu:latest
    needs: [lint, test]
    
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
    - uses: actions/checkout@v4:
    - uses: actions/setup-python@v5
      with: 
        python-version: matrix.python-version
        cache: pip
        cache-dependency-path: beispiel-app/requirements.txt
    - name: Build Container Image
      run: make build

    - name: Smoke-test the image
      run: |
        docker run -d --name taskboard-ci -p 8000:8000 taskboard:ci
        for i in $(seq 1 30); do
          if curl -sf http://127.0.0.1:8000/health; then
            echo "health check passed"
            docker rm -f taskboard-ci
            exit 0
          fi
          sleep 1
        done
        echo "health check never passed"
        docker logs taskboard-ci
        docker rm -f taskboard-ci
        exit 1


